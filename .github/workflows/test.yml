name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only by default (OpenSSF Scorecard: Token-Permissions).
permissions:
  contents: read

# A newer push to the same branch replaces a run still waiting for a Mac.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Two toolchains: macos-15 has Xcode 16 (the oldest the README promises, Swift 6.1+, no on-device model), macos-26
    # has Xcode 26 (the macOS 26 SDK, whose Apple APIs differ from the 27 SDK the maintainer builds with).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Pinned to a commit (Scorecard: Pinned-Dependencies); Dependabot keeps it current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
