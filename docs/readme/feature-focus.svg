<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img">
<title>Hush hiding during a video call, and missing from a screenshot</title>
<style>
.bob{animation:bob 3.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.blink [id$="-eyes-open"]{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}
.card{animation:rise 7s ease-in-out infinite}
@keyframes rise{0%,78%{opacity:1;transform:translateY(0)}84%,90%{opacity:0;transform:translateY(10px)}96%,100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.bob,.blink [id$="-eyes-open"],.card{animation:none}}
</style>
